<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Moamen Adel, Full Stack Developer">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="c"><rect width="1000" height="300" rx="18"/></clipPath></defs>
<style>text{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-1000}}
.blob{animation:drift 18s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(50px,18px)}}
.wave{animation:wv linear infinite}@keyframes wv{to{transform:translateX(500px)}}
.star{animation:tw 6s ease-in-out infinite;opacity:.15}@keyframes tw{50%{opacity:.6}}
.role{opacity:0;animation:role 10s infinite both}@keyframes role{0%{opacity:0;transform:translateY(8px)}6%,44%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.role:not(.rx){opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rx{display:none}}</style>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset=".55" stop-color="#111a33"/><stop offset="1" stop-color="#1a1b3a"/></linearGradient><radialGradient id="glow0"><stop stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="glow1"><stop stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient><g clip-path="url(#c)"><rect width="1000" height="300" fill="url(#sky)"/><ellipse class="blob" cx="190" cy="70" rx="380" ry="230" fill="url(#glow0)"/><ellipse class="blob" cx="820" cy="280" rx="400" ry="240" fill="url(#glow1)" style="animation-delay:-8s"/><path class="wave" d="M-1000 258 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 V300 H-1000Z" fill="#38bdf8" opacity="0.05" style="animation-duration:26s"/><path class="wave" d="M-1000 272 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 q125 -26 250 0 t250 0 V300 H-1000Z" fill="#818cf8" opacity="0.07" style="animation-duration:34s"/><circle class="star" cx="20" cy="16" r="1.0" fill="#cbd5e1" style="animation-delay:-0.0s"/><circle class="star" cx="259" cy="113" r="1.4" fill="#cbd5e1" style="animation-delay:-0.9s"/><circle class="star" cx="498" cy="100" r="1.0" fill="#cbd5e1" style="animation-delay:-1.8s"/><circle class="star" cx="737" cy="87" r="1.4" fill="#cbd5e1" style="animation-delay:-2.7s"/><circle class="star" cx="976" cy="74" r="1.0" fill="#cbd5e1" style="animation-delay:-3.6s"/><circle class="star" cx="255" cy="61" r="1.4" fill="#cbd5e1" style="animation-delay:-4.5s"/><circle class="star" cx="494" cy="48" r="1.0" fill="#cbd5e1" style="animation-delay:-5.4s"/><circle class="star" cx="733" cy="35" r="1.4" fill="#cbd5e1" style="animation-delay:-6.3s"/><circle class="star" cx="972" cy="22" r="1.0" fill="#cbd5e1" style="animation-delay:-7.2s"/><circle class="star" cx="251" cy="119" r="1.4" fill="#cbd5e1" style="animation-delay:-8.1s"/><circle class="star" cx="490" cy="106" r="1.0" fill="#cbd5e1" style="animation-delay:-9.0s"/><circle class="star" cx="729" cy="93" r="1.4" fill="#cbd5e1" style="animation-delay:-9.9s"/><circle class="star" cx="968" cy="80" r="1.0" fill="#cbd5e1" style="animation-delay:-10.8s"/><circle class="star" cx="247" cy="67" r="1.4" fill="#cbd5e1" style="animation-delay:-11.7s"/><g style="animation:up 1s .2s both"><text x="500" y="136" text-anchor="middle" font-size="82" font-weight="700" letter-spacing="1" fill="url(#name)">Moamen Adel</text></g><linearGradient id="name" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="740" y2="0"><stop stop-color="#bae6fd"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient><rect x="465" y="164" width="70" height="3" rx="1.5" fill="#818cf8" opacity=".7"/><text class="role" x="500" y="210" text-anchor="middle" font-size="24" font-weight="500" fill="#cbd5e1" style="animation-delay:0s">Full Stack Developer</text><text class="role rx" x="500" y="210" text-anchor="middle" font-size="24" font-weight="500" fill="#cbd5e1" style="animation-delay:5s">Building Multi-Tenant SaaS Platforms</text></g><rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="#94a3b8" stroke-opacity=".18"/></svg>