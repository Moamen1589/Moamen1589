<rect width="492" height="250" rx="18" fill="#0a0e1a"/><g clip-path="url(#c)"><circle cx="460" cy="10" r="80" fill="#22d3ee" opacity=".3" filter="url(#blur)"/></g><text x="26" y="44" font-size="21" fill="#f8fafc" font-weight="700">Multi-Tenant Academy SaaS</text><text x="26" y="78" font-size="15" fill="#94a3b8" >Multiple academies on one shared system:</text><text x="26" y="101" font-size="15" fill="#94a3b8" >courses, exams, attendance, tenant isolation</text><text x="26" y="124" font-size="15" fill="#94a3b8" >and customizable landing pages.</text><rect x="26" y="152" width="76" height="28" rx="14" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".55"/><text x="64.0" y="171" font-size="12" fill="#22d3ee" text-anchor="middle">Next.js</text><rect x="110" y="152" width="68" height="28" rx="14" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".55"/><text x="144.0" y="171" font-size="12" fill="#22d3ee" text-anchor="middle">NestJS</text><rect x="186" y="152" width="68" height="28" rx="14" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".55"/><text x="220.0" y="171" font-size="12" fill="#22d3ee" text-anchor="middle">Prisma</text><rect x="262" y="152" width="61" height="28" rx="14" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".55"/><text x="292.5" y="171" font-size="12" fill="#22d3ee" text-anchor="middle">MySQL</text><rect x="331" y="152" width="46" height="28" rx="14" fill="#22d3ee" fill-opacity=".13" stroke="#22d3ee" stroke-opacity=".55"/><text x="354.0" y="171" font-size="12" fill="#22d3ee" text-anchor="middle">JWT</text><text x="26" y="222" font-size="16" fill="#22d3ee" font-weight="700">Live Demo  →</text><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#22d3ee" stroke-width="2" pathLength="1000" stroke-dasharray="160 840" style="animation:flow 7s linear infinite"/></svg>