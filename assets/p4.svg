<svg xmlns="http://www.w3.org/2000/svg" width="492" height="250" viewBox="0 0 492 250" role="img" aria-label="Course Master API">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="c"><rect width="492" height="250" rx="18"/></clipPath></defs>
<style>text{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-1000}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.rx{display:none}}</style>
<rect width="492" height="250" rx="18" fill="#0a0e1a"/><g clip-path="url(#c)"><circle cx="460" cy="10" r="80" fill="#34d399" opacity=".3" filter="url(#blur)"/></g><text x="26" y="44" font-size="21" fill="#f8fafc" font-weight="700">Course Master API</text><text x="26" y="78" font-size="15" fill="#94a3b8" >17+ endpoints for courses and enrollments,</text><text x="26" y="101" font-size="15" fill="#94a3b8" >role-based access for 3 user roles and file</text><text x="26" y="124" font-size="15" fill="#94a3b8" >uploads, following MVC.</text><rect x="26" y="152" width="76" height="28" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/><text x="64.0" y="171" font-size="12" fill="#34d399" text-anchor="middle">Express</text><rect x="110" y="152" width="76" height="28" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/><text x="148.0" y="171" font-size="12" fill="#34d399" text-anchor="middle">MongoDB</text><rect x="194" y="152" width="46" height="28" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/><text x="217.0" y="171" font-size="12" fill="#34d399" text-anchor="middle">JWT</text><rect x="248" y="152" width="68" height="28" rx="14" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".55"/><text x="282.0" y="171" font-size="12" fill="#34d399" text-anchor="middle">Multer</text><text x="26" y="222" font-size="16" fill="#34d399" font-weight="700">Source Code  →</text><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#34d399" stroke-width="2" pathLength="1000" stroke-dasharray="160 840" style="animation:flow 7s linear infinite"/></svg>