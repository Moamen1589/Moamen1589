<svg xmlns="http://www.w3.org/2000/svg" width="492" height="250" viewBox="0 0 492 250" role="img" aria-label="Movie App">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="c"><rect width="492" height="250" rx="18"/></clipPath></defs>
<style>text{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-1000}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.rx{display:none}}</style>
<rect width="492" height="250" rx="18" fill="#0a0e1a"/><g clip-path="url(#c)"><circle cx="460" cy="10" r="80" fill="#fb923c" opacity=".3" filter="url(#blur)"/></g><text x="26" y="44" font-size="21" fill="#f8fafc" font-weight="700">Movie App</text><text x="26" y="78" font-size="15" fill="#94a3b8" >Responsive movie app with real-time data</text><text x="26" y="101" font-size="15" fill="#94a3b8" >from multiple APIs, favorites, watchlists</text><text x="26" y="124" font-size="15" fill="#94a3b8" >and dynamic routing.</text><rect x="26" y="152" width="61" height="28" rx="14" fill="#fb923c" fill-opacity=".13" stroke="#fb923c" stroke-opacity=".55"/><text x="56.5" y="171" font-size="12" fill="#fb923c" text-anchor="middle">React</text><rect x="95" y="152" width="53" height="28" rx="14" fill="#fb923c" fill-opacity=".13" stroke="#fb923c" stroke-opacity=".55"/><text x="121.5" y="171" font-size="12" fill="#fb923c" text-anchor="middle">Vite</text><rect x="156" y="152" width="113" height="28" rx="14" fill="#fb923c" fill-opacity=".13" stroke="#fb923c" stroke-opacity=".55"/><text x="212.5" y="171" font-size="12" fill="#fb923c" text-anchor="middle">Tailwind CSS</text><rect x="277" y="152" width="105" height="28" rx="14" fill="#fb923c" fill-opacity=".13" stroke="#fb923c" stroke-opacity=".55"/><text x="329.5" y="171" font-size="12" fill="#fb923c" text-anchor="middle">Context API</text><text x="26" y="222" font-size="16" fill="#fb923c" font-weight="700">Live Demo  →</text><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#fb923c" stroke-width="2" pathLength="1000" stroke-dasharray="160 840" style="animation:flow 7s linear infinite"/></svg>