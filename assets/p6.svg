<svg xmlns="http://www.w3.org/2000/svg" width="492" height="250" viewBox="0 0 492 250" role="img" aria-label="More Projects">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="45"/></filter>
<clipPath id="c"><rect width="492" height="250" rx="18"/></clipPath></defs>
<style>text{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,'DejaVu Sans Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-1000}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.rx{display:none}}</style>
<rect width="492" height="250" rx="18" fill="#0a0e1a"/><g clip-path="url(#c)"><circle cx="460" cy="10" r="80" fill="#60a5fa" opacity=".3" filter="url(#blur)"/></g><text x="26" y="44" font-size="21" fill="#f8fafc" font-weight="700">More Projects</text><text x="26" y="78" font-size="15" fill="#94a3b8" >Explore the rest of my work and</text><text x="26" y="101" font-size="15" fill="#94a3b8" >experiments on GitHub.</text><rect x="26" y="152" width="105" height="28" rx="14" fill="#60a5fa" fill-opacity=".13" stroke="#60a5fa" stroke-opacity=".55"/><text x="78.5" y="171" font-size="12" fill="#60a5fa" text-anchor="middle">Open Source</text><text x="26" y="222" font-size="16" fill="#60a5fa" font-weight="700">All Repositories  →</text><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#1e293b" stroke-width="1.5"/><rect x="1" y="1" width="490" height="248" rx="17" fill="none" stroke="#60a5fa" stroke-width="2" pathLength="1000" stroke-dasharray="160 840" style="animation:flow 7s linear infinite"/></svg>